name: Update GitHub Profile

on:
  workflow_dispatch:

  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  update-profile:
    name: Generate Profile Telemetry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate GitHub telemetry
        run: node scripts/update-profile.mjs

      - name: Check for changes
        id: changes
        run: |
          git add assets/github-metrics.svg

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No telemetry changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Telemetry changed."
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: update GitHub profile telemetry"
          git push