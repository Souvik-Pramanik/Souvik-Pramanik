name: Update GitHub Profile

on:
  workflow_dispatch:

  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate GitHub telemetry
        run: node scripts/update-profile.mjs

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit telemetry
        run: |
          git add assets/github-metrics.svg

          if git diff --cached --quiet; then
            echo "No telemetry changes detected."
            exit 0
          fi

          git commit -m "chore: update GitHub profile telemetry"
          git push