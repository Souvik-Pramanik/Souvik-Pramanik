name: Profile Telemetry

on:
  schedule:
    - cron: "23 1 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  telemetry:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate GitHub telemetry
        run: node scripts/update-profile.mjs

      - name: Commit telemetry
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-metrics.svg

          if git diff --cached --quiet; then
            echo "No telemetry changes."
            exit 0
          fi

          git commit \
            -m "chore: update GitHub profile telemetry"

          git push