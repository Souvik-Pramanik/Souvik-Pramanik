<svg width="1200" height="360" viewBox="0 0 1200 360"
     xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#05070A"/>
    <stop offset="50%" stop-color="#0D1117"/>
    <stop offset="100%" stop-color="#111827"/>
  </linearGradient>

  <linearGradient id="accent" x1="0" x2="1">
    <stop offset="0%" stop-color="#58A6FF"/>
    <stop offset="50%" stop-color="#A371F7"/>
    <stop offset="100%" stop-color="#3FB950"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect width="1200" height="360" rx="20" fill="url(#bg)"/>

<!-- Grid -->
<g opacity="0.08" stroke="#58A6FF">
  <path d="M0 60H1200"/>
  <path d="M0 120H1200"/>
  <path d="M0 180H1200"/>
  <path d="M0 240H1200"/>
  <path d="M0 300H1200"/>

  <path d="M100 0V360"/>
  <path d="M200 0V360"/>
  <path d="M300 0V360"/>
  <path d="M400 0V360"/>
  <path d="M500 0V360"/>
  <path d="M600 0V360"/>
  <path d="M700 0V360"/>
  <path d="M800 0V360"/>
  <path d="M900 0V360"/>
  <path d="M1000 0V360"/>
  <path d="M1100 0V360"/>
</g>

<!-- Decorative circuit -->
<g fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.7">

  <path d="M70 80H230V125H340"/>
  <circle cx="70" cy="80" r="5" fill="#58A6FF"/>
  <circle cx="340" cy="125" r="5" fill="#3FB950"/>

  <path d="M850 75H1040V130H1130"/>
  <circle cx="850" cy="75" r="5" fill="#A371F7"/>
  <circle cx="1130" cy="130" r="5" fill="#3FB950"/>

  <path d="M900 280H1030V235H1140"/>
  <circle cx="900" cy="280" r="5" fill="#58A6FF"/>
  <circle cx="1140" cy="235" r="5" fill="#A371F7"/>

</g>

<!-- Terminal -->
<rect x="70" y="205" width="280" height="80"
      rx="10"
      fill="#010409"
      stroke="#30363D"/>

<circle cx="90" cy="225" r="5" fill="#FF7B72"/>
<circle cx="108" cy="225" r="5" fill="#D29922"/>
<circle cx="126" cy="225" r="5" fill="#3FB950"/>

<text x="90" y="252"
      font-family="monospace"
      font-size="14"
      fill="#8B949E">
  ~/souvik
</text>

<text x="90" y="272"
      font-family="monospace"
      font-size="14"
      fill="#58A6FF">
  $ systemctl status devops
</text>

<!-- Main identity -->
<text x="600" y="125"
      text-anchor="middle"
      font-family="monospace"
      font-size="48"
      font-weight="700"
      fill="#F0F6FC">
  SOUVIK PRAMANIK
</text>

<text x="600" y="170"
      text-anchor="middle"
      font-family="monospace"
      font-size="22"
      letter-spacing="5"
      fill="url(#accent)"
      filter="url(#glow)">
  CLOUD &amp; DEVOPS ENGINEER
</text>

<text x="600" y="215"
      text-anchor="middle"
      font-family="monospace"
      font-size="14"
      fill="#8B949E">
  BUILD  •  AUTOMATE  •  DEPLOY  •  OBSERVE
</text>

<!-- Status -->
<circle cx="550" cy="260" r="6"
        fill="#3FB950"
        filter="url(#glow)"/>

<text x="565" y="266"
      font-family="monospace"
      font-size="14"
      fill="#3FB950">
  SYSTEM ONLINE
</text>

<text x="600" y="320"
      text-anchor="middle"
      font-family="monospace"
      font-size="12"
      fill="#484F58">
  PROFILE::V2 // AUTOMATED ENGINEERING INTERFACE
</text>

</svg>